name: Daily Live Stream Auto-Refresh

on:
  schedule:
    # 每天北京时间凌晨 04:00 (UTC 20:00) 自动执行
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python3 -m unittest discover tests

      - name: Run live crawler pipeline
        run: |
          python3 run.py --timeout 3.0 --concurrency 25

      - name: Commit and push updated live sources
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No changes in live stream outputs to commit."
          else
            git commit -m "chore(cron): auto-refresh live stream sources [$(date +'%Y-%m-%d %H:%M:%S')]"
            git push
          fi
